<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务端 - 交易对分类展示 - 三端原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1116;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        /* 平台切换器 */
        .platform-switcher {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(30, 35, 45, 0.95);
            padding: 8px 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(240, 185, 11, 0.2);
        }

        .platform-btn {
            padding: 8px 20px;
            border: 1px solid rgba(240, 185, 11, 0.3);
            background: transparent;
            color: #9ca3af;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .platform-btn:hover {
            border-color: rgba(240, 185, 11, 0.5);
            color: #f0b90b;
        }

        .platform-btn.active {
            background: #f0b90b;
            color: #0d1116;
            border-color: #f0b90b;
            font-weight: 600;
        }

        /* 视图容器 */
        .view-container {
            display: none;
            padding-top: 80px;
        }

        .view-container.active {
            display: block;
        }

        /* Web端样式 */
        .web-view {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .web-header {
            background: #1a1f2e;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .web-header h2 {
            font-size: 18px;
            color: #f0b90b;
            margin-bottom: 8px;
        }

        .web-header p {
            font-size: 13px;
            color: #9ca3af;
        }

        .web-search-box {
            background: #1a1f2e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .web-search-input {
            width: 100%;
            padding: 12px 16px;
            background: #0d1116;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
        }

        .web-search-input:focus {
            outline: none;
            border-color: #f0b90b;
        }

        .web-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: #1a1f2e;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .web-tab {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 8px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .web-tab:hover {
            border-color: rgba(240, 185, 11, 0.5);
            color: #f0b90b;
        }

        .web-tab.active {
            background: #f0b90b;
            color: #0d1116;
            border-color: #f0b90b;
            font-weight: 600;
        }

        /* Web端子分类筛选 */
        .web-subcategories {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .web-subcategory-chip {
            padding: 6px 14px;
            background: #1a1f2e;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 16px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .web-subcategory-chip:hover {
            border-color: rgba(240, 185, 11, 0.5);
            color: #f0b90b;
        }

        .web-subcategory-chip.active {
            background: rgba(240, 185, 11, 0.15);
            border-color: #f0b90b;
            color: #f0b90b;
        }

        .web-filters {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .web-filter-chip {
            padding: 8px 16px;
            background: #1a1f2e;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 20px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .web-filter-chip:hover {
            border-color: rgba(240, 185, 11, 0.5);
            color: #f0b90b;
        }

        .web-filter-chip.active {
            background: rgba(240, 185, 11, 0.15);
            border-color: #f0b90b;
            color: #f0b90b;
        }

        .web-table {
            background: #1a1f2e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .web-table-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            padding: 14px 20px;
            background: #151a26;
            border-bottom: 1px solid rgba(240, 185, 11, 0.1);
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
        }

        .web-table-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(240, 185, 11, 0.05);
            transition: background 0.2s;
            cursor: pointer;
            align-items: center;
        }

        .web-table-row:hover {
            background: rgba(240, 185, 11, 0.05);
        }

        .web-table-row.closed {
            opacity: 0.5;
        }

        .web-pair-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .web-pair-star {
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
        }

        .web-pair-star.favorited {
            color: #f0b90b;
        }

        .web-pair-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }

        .web-pair-name {
            font-weight: 600;
            font-size: 14px;
            color: #e5e7eb;
        }

        .web-pair-tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .web-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .web-tag.hot {
            background: rgba(240, 185, 11, 0.15);
            color: #f0b90b;
        }

        .web-tag.zero-fee {
            background: rgba(14, 203, 129, 0.15);
            color: #0ecb81;
        }

        .web-tag.new {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .web-price {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 500;
            color: #e5e7eb;
        }

        .web-change {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .web-change.positive {
            color: #0ecb81;
        }

        .web-change.negative {
            color: #f6465d;
        }

        .web-volume {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #9ca3af;
        }

        .web-countdown {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(246, 70, 93, 0.15);
            color: #f6465d;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        /* App端样式 */
        .app-view {
            max-width: 420px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .app-header {
            background: #1a1f2e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .app-header h2 {
            font-size: 16px;
            color: #f0b90b;
        }

        .app-search-box {
            background: #1a1f2e;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .app-search-input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1116;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
        }

        .app-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .app-tab {
            padding: 8px 16px;
            background: #1a1f2e;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 20px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .app-tab.active {
            background: #f0b90b;
            color: #0d1116;
            border-color: #f0b90b;
            font-weight: 600;
        }

        .app-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .app-filter-chip {
            padding: 6px 14px;
            background: #1a1f2e;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 16px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .app-filter-chip.active {
            background: rgba(240, 185, 11, 0.15);
            border-color: #f0b90b;
            color: #f0b90b;
        }

        .app-card-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .app-card {
            background: #1a1f2e;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(240, 185, 11, 0.1);
            cursor: pointer;
            transition: all 0.2s;
        }

        .app-card:hover {
            background: #1f2535;
            border-color: rgba(240, 185, 11, 0.3);
        }

        .app-card.closed {
            opacity: 0.5;
        }

        .app-card-row1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .app-card-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-card-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .app-card-name {
            font-weight: 600;
            font-size: 15px;
            color: #e5e7eb;
        }

        .app-card-tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .app-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .app-tag.hot {
            background: rgba(240, 185, 11, 0.15);
            color: #f0b90b;
        }

        .app-tag.zero-fee {
            background: rgba(14, 203, 129, 0.15);
            color: #0ecb81;
        }

        .app-card-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-card-price {
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            font-weight: 600;
            color: #e5e7eb;
        }

        .app-card-change {
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        .app-card-change.positive {
            background: rgba(14, 203, 129, 0.15);
            color: #0ecb81;
        }

        .app-card-change.negative {
            background: rgba(246, 70, 93, 0.15);
            color: #f6465d;
        }

        /* H5端样式 */
        .h5-view {
            max-width: 375px;
            margin: 0 auto;
            padding: 0 12px;
        }

        .h5-header {
            background: #1a1f2e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(240, 185, 11, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .h5-header h2 {
            font-size: 15px;
            color: #f0b90b;
        }

        .h5-close-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
        }

        .h5-search-box {
            background: #1a1f2e;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(240, 185, 11, 0.1);
        }

        .h5-search-input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1116;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 6px;
            color: #e5e7eb;
            font-size: 13px;
        }

        .h5-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .h5-tab {
            padding: 10px;
            background: #1a1f2e;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 8px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: all 0.3s;
        }

        .h5-tab.active {
            background: rgba(240, 185, 11, 0.15);
            border-color: #f0b90b;
            color: #f0b90b;
            font-weight: 600;
        }

        .h5-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .h5-filter-chip {
            flex: 1;
            padding: 8px;
            background: #1a1f2e;
            border: 1px solid rgba(240, 185, 11, 0.2);
            border-radius: 8px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.3s;
        }

        .h5-filter-chip.active {
            background: rgba(240, 185, 11, 0.15);
            border-color: #f0b90b;
            color: #f0b90b;
        }

        .h5-list {
            display: flex;
            flex-direction: column;
        }

        .h5-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(240, 185, 11, 0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .h5-list-item:hover {
            background: rgba(240, 185, 11, 0.05);
        }

        .h5-list-item.closed {
            opacity: 0.5;
        }

        .h5-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .h5-item-name {
            font-weight: 600;
            font-size: 14px;
            color: #e5e7eb;
        }

        .h5-item-hot {
            color: #f0b90b;
            font-size: 12px;
        }

        .h5-item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .h5-item-price {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            font-weight: 500;
            color: #e5e7eb;
        }

        .h5-item-change {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }

        .h5-item-change.positive {
            color: #0ecb81;
        }

        .h5-item-change.negative {
            color: #f6465d;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .web-view {
                padding: 0 16px;
            }

            .web-table-header,
            .web-table-row {
                grid-template-columns: 2fr 1fr 1fr;
            }

            .web-table-header > div:nth-child(4),
            .web-table-header > div:nth-child(5),
            .web-table-row > div:nth-child(4),
            .web-table-row > div:nth-child(5) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 平台切换器 -->
    <div class="platform-switcher">
        <button class="platform-btn active" onclick="switchPlatform('web')">Web 桌面端</button>
        <button class="platform-btn" onclick="switchPlatform('app')">App 移动端</button>
        <button class="platform-btn" onclick="switchPlatform('h5')">H5 Mini App</button>
    </div>

    <!-- Web端视图 -->
    <div class="view-container web-view active">
        <div class="web-header">
            <h2>交易对列表</h2>
            <p>选择交易对开始交易</p>
        </div>

        <div class="web-search-box">
            <input type="text" class="web-search-input" placeholder="搜索交易对名称或代码..." oninput="filterPairs('web')">
        </div>

        <div class="web-tabs">
            <button class="web-tab active" onclick="switchCategory('web', 'all')">全部</button>
            <button class="web-tab" onclick="switchCategory('web', 'crypto')">数字货币</button>
            <button class="web-tab" onclick="switchCategory('web', 'tradfi')">传统金融</button>
            <button class="web-tab" onclick="switchCategory('web', 'stock')">股票</button>
        </div>

        <div class="web-subcategories" id="web-subcategories">
            <button class="web-subcategory-chip active" onclick="switchSubCategory('web', 'all')">全部</button>
        </div>

        <div class="web-filters">
            <button class="web-filter-chip active" onclick="switchFilter('web', 'all')">全部</button>
            <button class="web-filter-chip" onclick="switchFilter('web', 'hot')">🔥 热门</button>
            <button class="web-filter-chip" onclick="switchFilter('web', 'zero-fee')">0 Fees</button>
            <button class="web-filter-chip" onclick="switchFilter('web', 'active')">✅ 可交易</button>
            <button class="web-filter-chip" onclick="switchFilter('web', 'closed')">⏸ 已关闭</button>
        </div>

        <div class="web-table">
            <div class="web-table-header">
                <div>交易对</div>
                <div>最新价格</div>
                <div>24H涨跌</div>
                <div>24H成交额</div>
                <div>状态</div>
            </div>
            <div id="web-table-body"></div>
        </div>
    </div>

    <!-- App端视图 -->
    <div class="view-container app-view">
        <div class="app-header">
            <h2>选择交易对</h2>
        </div>

        <div class="app-search-box">
            <input type="text" class="app-search-input" placeholder="搜索交易对名称..." oninput="filterPairs('app')">
        </div>

        <div class="app-tabs">
            <button class="app-tab active" onclick="switchCategory('app', 'all')">全部</button>
            <button class="app-tab" onclick="switchCategory('app', 'crypto')">数字货币</button>
            <button class="app-tab" onclick="switchCategory('app', 'tradfi')">传统金融</button>
            <button class="app-tab" onclick="switchCategory('app', 'stock')">股票</button>
        </div>

        <div class="app-filters">
            <button class="app-filter-chip active" onclick="switchFilter('app', 'all')">全部</button>
            <button class="app-filter-chip" onclick="switchFilter('app', 'hot')">🔥 热门</button>
            <button class="app-filter-chip" onclick="switchFilter('app', 'zero-fee')">0 Fees</button>
            <button class="app-filter-chip" onclick="switchFilter('app', 'active')">✅ 可交易</button>
        </div>

        <div class="app-card-list" id="app-card-list"></div>
    </div>

    <!-- H5端视图 -->
    <div class="view-container h5-view">
        <div class="h5-header">
            <h2>选择交易对</h2>
            <div class="h5-close-btn">✕</div>
        </div>

        <div class="h5-search-box">
            <input type="text" class="h5-search-input" placeholder="搜索..." oninput="filterPairs('h5')">
        </div>

        <div class="h5-tabs">
            <button class="h5-tab active" onclick="switchCategory('h5', 'all')">全部</button>
            <button class="h5-tab" onclick="switchCategory('h5', 'crypto')">数字货币</button>
            <button class="h5-tab" onclick="switchCategory('h5', 'tradfi')">传统金融</button>
            <button class="h5-tab" onclick="switchCategory('h5', 'stock')">股票</button>
        </div>

        <div class="h5-filters">
            <button class="h5-filter-chip active" onclick="switchFilter('h5', 'all')">全部</button>
            <button class="h5-filter-chip" onclick="switchFilter('h5', 'hot')">🔥 热门</button>
        </div>

        <div class="h5-list" id="h5-list"></div>
    </div>

    <script>
        // 模拟数据
        const pairsData = [
            {
                id: 1,
                name: 'BTC/USDT',
                icon: '₿',
                iconBg: '#f7931a',
                category: 'crypto',
                tags: ['hot', 'zero-fee'],
                price: 63610.38,
                change: -1.63,
                volume: '2.8B',
                status: 'active',
                favorited: true
            },
            {
                id: 2,
                name: 'ETH/USDT',
                icon: 'Ξ',
                iconBg: '#627eea',
                category: 'crypto',
                tags: ['hot', 'zero-fee'],
                price: 1856.67,
                change: -3.54,
                volume: '1.5B',
                status: 'active',
                favorited: false
            },
            {
                id: 3,
                name: 'SOL/USDT',
                icon: '◎',
                iconBg: '#9945ff',
                category: 'crypto',
                tags: ['hot', 'zero-fee'],

        // 当前筛选状态
        const currentFilters = {
            web: { category: 'all', filter: 'all', search: '' },
            app: { category: 'all', filter: 'all', search: '' },
            h5: { category: 'all', filter: 'all', search: '' }
        };

        // 切换平台
        function switchPlatform(platform) {
            document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));
            
            event.target.classList.add('active');
            document.querySelector(`.${platform}-view`).classList.add('active');
        }

        // 切换分类
        function switchCategory(platform, category) {
            currentFilters[platform].category = category;
            
            const container = document.querySelector(`.${platform}-view`);
            container.querySelectorAll(`.${platform}-tab`).forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            filterPairs(platform);
        }

        // 切换筛选
        function switchFilter(platform, filter) {
            currentFilters[platform].filter = filter;
            
            const container = document.querySelector(`.${platform}-view`);
            container.querySelectorAll(`.${platform}-filter-chip`).forEach(chip => chip.classList.remove('active'));
            event.target.classList.add('active');
            
            filterPairs(platform);
        }

        // 筛选交易对
        function filterPairs(platform) {
            const searchInput = document.querySelector(`.${platform}-search-input`);
            if (searchInput) {
                currentFilters[platform].search = searchInput.value.toLowerCase();
            }

            const filtered = pairsData.filter(pair => {
                // 搜索筛选
                if (currentFilters[platform].search && !pair.name.toLowerCase().includes(currentFilters[platform].search)) {
                    return false;
                }

                // 分类筛选
                if (currentFilters[platform].category !== 'all' && pair.category !== currentFilters[platform].category) {
                    return false;
                }

                // 标签筛选
                if (currentFilters[platform].filter !== 'all') {
                    if (currentFilters[platform].filter === 'hot' && !pair.tags.includes('hot')) {
                        return false;
                    }
                    if (currentFilters[platform].filter === 'zero-fee' && !pair.tags.includes('zero-fee')) {
                        return false;
                    }
                    if (currentFilters[platform].filter === 'active' && pair.status !== 'active') {
                        return false;
                    }
                    if (currentFilters[platform].filter === 'closed' && pair.status !== 'closed') {
                        return false;
                    }
                }

                return true;
            });

            renderPairs(platform, filtered);
        }

        // 渲染交易对
        function renderPairs(platform, pairs) {
            if (platform === 'web') {
                renderWebPairs(pairs);
            } else if (platform === 'app') {
                renderAppPairs(pairs);
            } else if (platform === 'h5') {
                renderH5Pairs(pairs);
            }
        }

        // 渲染Web端
        function renderWebPairs(pairs) {
            const tbody = document.getElementById('web-table-body');
            tbody.innerHTML = pairs.map(pair => `
                <div class="web-table-row ${pair.status === 'closed' ? 'closed' : ''}">
                    <div class="web-pair-info">
                        <span class="web-pair-star ${pair.favorited ? 'favorited' : ''}" onclick="toggleFavorite(${pair.id})">★</span>
                        <div class="web-pair-icon" style="background: ${pair.iconBg}">${pair.icon}</div>
                        <div>
                            <div class="web-pair-name">${pair.name}</div>
                            <div class="web-pair-tags">
                                ${pair.tags.map(tag => `<span class="web-tag ${tag}">${tag === 'hot' ? '🔥 热门' : tag === 'zero-fee' ? '0 Fees' : tag === 'new' ? '🆕 新币' : tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="web-price">${pair.price.toLocaleString()}</div>
                    <div class="web-change ${pair.change >= 0 ? 'positive' : 'negative'}">${pair.change >= 0 ? '+' : ''}${pair.change}%</div>
                    <div class="web-volume">${pair.volume}</div>
                    <div>
                        ${pair.status === 'closed' ? `<span class="web-countdown">⏸ ${pair.countdown}</span>` : '<span style="color: #0ecb81; font-size: 13px;">交易中</span>'}
                    </div>
                </div>
            `).join('');
        }

        // 渲染App端
        function renderAppPairs(pairs) {
            const list = document.getElementById('app-card-list');
            list.innerHTML = pairs.map(pair => `
                <div class="app-card ${pair.status === 'closed' ? 'closed' : ''}">
                    <div class="app-card-row1">
                        <div class="app-card-left">
                            <div class="app-card-icon" style="background: ${pair.iconBg}">${pair.icon}</div>
                            <div>
                                <div class="app-card-name">${pair.name}</div>
                                <div class="app-card-tags">
                                    ${pair.tags.map(tag => `<span class="app-tag ${tag}">${tag === 'hot' ? '🔥 热门' : tag === 'zero-fee' ? '0 Fees' : tag === 'new' ? '🆕 新币' : tag}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        ${pair.status === 'closed' ? `<span class="web-countdown">⏸ ${pair.countdown}</span>` : ''}
                    </div>
                    <div class="app-card-row2">
                        <div class="app-card-price">${pair.price.toLocaleString()}</div>
                        <div class="app-card-change ${pair.change >= 0 ? 'positive' : 'negative'}">${pair.change >= 0 ? '+' : ''}${pair.change}%</div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染H5端
        function renderH5Pairs(pairs) {
            const list = document.getElementById('h5-list');
            list.innerHTML = pairs.map(pair => `
                <div class="h5-list-item ${pair.status === 'closed' ? 'closed' : ''}">
                    <div class="h5-item-left">
                        <div class="h5-item-name">${pair.name}</div>
                        ${pair.tags.includes('hot') ? '<div class="h5-item-hot">🔥</div>' : ''}
                    </div>
                    <div class="h5-item-right">
                        <div class="h5-item-price">${pair.price.toLocaleString()}</div>
                        <div class="h5-item-change ${pair.change >= 0 ? 'positive' : 'negative'}">${pair.change >= 0 ? '+' : ''}${pair.change}%</div>
                    </div>
                </div>
            `).join('');
        }

        // 切换收藏
        function toggleFavorite(id) {
            const pair = pairsData.find(p => p.id === id);
            if (pair) {
                pair.favorited = !pair.favorited;
                filterPairs('web');
            }
        }

        // 初始化渲染
        filterPairs('web');
        filterPairs('app');
        filterPairs('h5');
    </script>
